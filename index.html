<!doctype html>
<html lang="en">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Chapter & Compass | The Three Musketeers</title>
	<meta name="description" content="An interactive literature experience for The Three Musketeers." />
	<script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
	<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
	<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
	<style>
		@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=DM+Sans:wght@400;500;700&display=swap');
		:root { --ink:#152235; --navy:#101b2d; --night:#0a1220; --paper:#f3e9d5; --cream:#fff8e8; --gold:#d6a84f; --burgundy:#7d2e3d; --muted:#a9b3c1; --line:rgba(243,233,213,.18); }
		* { box-sizing:border-box; } body { margin:0; background:var(--night); color:var(--cream); font-family:'DM Sans',sans-serif; } button { font:inherit; cursor:pointer; }
		h1,h2,h3,h4 { margin:0; font-family:'Cormorant Garamond',serif; line-height:.95; } p { line-height:1.65; color:#c4cad4; }
		.app { min-height:100vh; background:radial-gradient(circle at 80% 0%,#24314a 0,#101a2c 38%,#08101c 100%); } .shell { width:min(1180px,calc(100% - 40px)); margin:auto; }
		.topbar { height:76px; border-bottom:1px solid var(--line); display:flex; align-items:center; justify-content:space-between; } .brand { color:var(--cream); text-decoration:none; letter-spacing:.16em; font-size:12px; font-weight:700; text-transform:uppercase; } .brand span { color:var(--gold); }
		.eyebrow { color:var(--gold); font-size:11px; letter-spacing:.18em; text-transform:uppercase; font-weight:700; } .muted { color:var(--muted); }
		.btn { border:1px solid var(--gold); background:var(--gold); color:var(--ink); padding:13px 19px; font-weight:700; transition:transform .2s,background .2s; } .btn:hover { transform:translateY(-2px); background:#ebc46e; } .btn.ghost { background:transparent; color:var(--cream); border-color:var(--line); } .btn:disabled { opacity:.35; cursor:not-allowed; transform:none; }
		.landing { min-height:calc(100vh - 76px); display:grid; place-items:center; text-align:center; padding:70px 0; } .landing-inner { max-width:730px; } .landing h1 { font-size:clamp(4rem,11vw,8.5rem); color:var(--paper); margin:20px 0 16px; } .landing h1 em { color:var(--gold); font-weight:500; } .landing p { font-size:20px; margin:0 auto 34px; }
		.page { padding:76px 0 90px; } .page-heading { max-width:700px; margin-bottom:44px; } .page-heading h1 { font-size:clamp(3.4rem,7vw,6rem); color:var(--paper); margin:14px 0 18px; } .page-heading p { font-size:18px; }
		.book-grid { display:grid; grid-template-columns:minmax(220px,310px) 1fr; gap:52px; align-items:center; } .book-cover { min-height:430px; padding:24px; background:linear-gradient(145deg,#9c3546,#552233 50%,#1d2334); border:9px solid #d0a963; box-shadow:14px 18px 0 rgba(0,0,0,.18); display:flex; flex-direction:column; justify-content:space-between; text-align:center; } .cover-mark { border:1px solid rgba(255,244,200,.6); padding:24px 10px; height:100%; display:flex; flex-direction:column; justify-content:center; } .cover-mark strong { font:700 38px/ .85 'Cormorant Garamond'; color:#f9e4ae; } .cover-mark small { margin-top:18px; color:#efcf8c; letter-spacing:.15em; font-size:10px; } .book-copy h2 { font-size:56px; color:var(--paper); } .book-copy .author { color:var(--gold); font-size:18px; margin:12px 0 24px; } .book-copy p { max-width:560px; }
		.character-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:14px; } .character-card { text-align:left; min-height:230px; background:rgba(255,248,232,.06); border:1px solid var(--line); color:var(--cream); padding:22px; transition:border .2s,transform .2s,background .2s; } .character-card:hover { transform:translateY(-4px); border-color:var(--gold); } .character-card.selected { border:2px solid var(--gold); background:rgba(214,168,79,.13); } .character-initial { width:48px; height:48px; border:1px solid var(--gold); border-radius:50%; display:grid; place-items:center; color:var(--gold); font:700 28px 'Cormorant Garamond'; margin-bottom:28px; } .character-card h3 { font-size:30px; } .character-card p { font-size:13px; margin-bottom:0; }
		.selection-actions { display:flex; align-items:center; gap:20px; margin-top:30px; } .selection-actions span { color:var(--muted); font-size:13px; }
		.story-layout { display:grid; grid-template-columns:1fr 290px; gap:24px; align-items:start; } .world-panel { background:rgba(12,24,41,.84); border:1px solid var(--line); padding:18px; } .world-head { display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:14px; } .world-head h1 { font-size:0; color:var(--paper); } .world-head h1:after { content:'Musketeer Headquarters'; font-size:42px; } .world-head p { margin:5px 0 0; font-size:13px; }
		.map { position:relative; height:500px; overflow:hidden; border:1px solid rgba(243,233,213,.13); background:linear-gradient(#7895a3 0 35%,#bd9a62 35% 100%); } .map:before { content:''; position:absolute; inset:0; background:linear-gradient(155deg,transparent 0 42%,rgba(255,238,182,.18) 42% 43%,transparent 43%),linear-gradient(90deg,transparent 0 7%,rgba(46,36,31,.72) 7% 12%,transparent 12% 88%,rgba(46,36,31,.72) 88% 93%,transparent 93%); opacity:.8; } .map:after { content:'MUSKETEER HEADQUARTERS'; position:absolute; left:50%; top:6%; transform:translateX(-50%); color:rgba(255,248,232,.8); font:700 12px 'DM Sans'; letter-spacing:.2em; white-space:nowrap; text-shadow:0 2px 8px #263642; } .road { position:absolute; background:#856844; opacity:.7; transform-origin:center; } .road.h { height:78px; left:-5%; right:-5%; top:53%; transform:rotate(-4deg); } .road.v { width:72px; top:26%; bottom:-5%; left:54%; transform:rotate(7deg); } .location { position:absolute; transform:translate(-50%,-50%); min-width:108px; background:rgba(10,18,32,.9); color:var(--cream); border:1px solid rgba(243,233,213,.6); padding:9px 10px; text-align:center; font-size:12px; z-index:2; box-shadow:0 5px 12px rgba(0,0,0,.25); } .location:hover,.location.active { border-color:var(--gold); color:var(--gold); box-shadow:0 0 0 3px rgba(214,168,79,.2); } .location small { display:block; color:var(--muted); font-size:10px; margin-top:2px; } .player { position:absolute; transform:translate(-50%,-50%); z-index:4; width:34px; height:34px; border-radius:50%; background:var(--gold); color:var(--ink); display:grid; place-items:center; font:bold 18px 'Cormorant Garamond'; box-shadow:0 0 0 5px rgba(214,168,79,.18),0 5px 10px rgba(0,0,0,.35); transition:left .12s,top .12s; }
		.controls { display:flex; justify-content:space-between; align-items:center; gap:16px; margin-top:14px; } .keys { color:var(--muted); font-size:12px; } .dpad { display:grid; grid-template-columns:repeat(3,38px); grid-template-rows:repeat(2,34px); gap:4px; } .dpad button { border:1px solid var(--line); background:#1b2a40; color:var(--cream); } .dpad button:first-child { grid-column:2; }
		.side-panel { background:rgba(243,233,213,.08); border:1px solid var(--line); padding:20px; position:sticky; top:20px; } .side-panel h2 { color:var(--paper); font-size:32px; margin:9px 0; } .side-panel p { font-size:13px; } .status-list { list-style:none; padding:0; margin:22px 0; border-top:1px solid var(--line); } .status-list li { display:flex; justify-content:space-between; padding:11px 0; border-bottom:1px solid var(--line); font-size:12px; color:var(--muted); } .status-list b { color:var(--cream); font-weight:500; } .interaction { border-top:1px solid var(--line); padding-top:16px; margin-top:18px; }
		.timeline { display:flex; gap:5px; margin:0 0 20px; overflow-x:auto; padding-bottom:5px; } .timeline button { flex:1; min-width:82px; border:0; border-top:2px solid #475263; padding:9px 5px; background:transparent; color:#778397; text-align:left; font-size:10px; } .timeline button.visited { border-color:var(--gold); color:#d8dce0; } .timeline button.current { background:rgba(214,168,79,.13); color:var(--gold); } .timeline button:disabled { cursor:not-allowed; } .timeline .dot { display:block; margin-bottom:7px; font-size:14px; } .dialogue { margin-top:16px; background:var(--paper); color:var(--ink); padding:20px; border-left:4px solid var(--burgundy); } .dialogue strong { color:var(--burgundy); font-size:12px; letter-spacing:.1em; } .dialogue p { color:var(--ink); margin:8px 0 16px; }
		.event-panel { max-width:760px; margin-top:18px; padding:28px; background:rgba(243,233,213,.07); border:1px solid var(--line); } .event-panel h2 { color:var(--paper); font-size:44px; margin:8px 0 14px; } .event-panel p { margin-bottom:18px; } .event-meta { color:var(--gold); font-size:11px; letter-spacing:.12em; text-transform:uppercase; } .event-actions { display:flex; gap:10px; margin-top:16px; }
		.vr-launch { min-height:calc(100vh - 76px); padding:18px 0 30px; } .vr-launch-head { display:flex; justify-content:space-between; align-items:center; gap:20px; margin-bottom:14px; } .vr-launch-head h1 { color:var(--paper); font-size:38px; } .vr-launch-head p { margin:5px 0 0; font-size:13px; } .vr-actions { display:flex; gap:10px; align-items:center; } .vr-frame { display:block; width:100%; height:calc(100vh - 170px); min-height:560px; border:1px solid var(--line); background:#050505; }
		.not-found { text-align:center; padding:130px 20px; } .not-found h1 { font-size:100px; color:var(--gold); }
		@media (max-width:800px) { .shell { width:min(100% - 28px,600px); } .topbar { height:64px; } .book-grid,.story-layout { grid-template-columns:1fr; gap:30px; } .book-cover { min-height:340px; } .character-grid { grid-template-columns:repeat(2,1fr); } .page { padding-top:50px; } .map { height:420px; } .side-panel { position:static; } .world-head { display:block; } .world-head .eyebrow { margin-top:14px; } }
		@media (max-width:450px) { .character-grid { grid-template-columns:1fr; } .character-card { min-height:165px; } .character-initial { margin-bottom:14px; } .landing h1 { font-size:64px; } .controls { align-items:flex-end; } .keys { max-width:180px; } }
	</style>
</head>
<body><div id="root"></div>
<script type="text/babel">
const {useState,useEffect,useContext,createContext} = React;
const books = [{id:'three-musketeers', title:'The Three Musketeers', author:'Alexandre Dumas', description:'Enter a world of rivalries, secret errands, and friendships forged at the edge of a sword. Learn the shape of Dumas\' adventure by walking through its turning points.'}];
const characters = [
	{id:'dArtagnan',name:"D'Artagnan",description:'Young, ambitious, courageous, and determined to become a musketeer.'},
	{id:'athos',name:'Athos',description:'Experienced, disciplined, thoughtful, and composed.'},
	{id:'porthos',name:'Porthos',description:'Bold, confident, energetic, and flamboyant.'},
	{id:'aramis',name:'Aramis',description:'Intelligent, refined, strategic, and thoughtful.'}
];
const locations = [
	{id:'gate',name:'HQ Gate',description:'The iron gate opens onto Paris. A courier has just arrived with a sealed royal message.',x:13,y:61},
	{id:'training',name:'Training Yard',description:'A broad stone yard where musketeers practice footwork, timing, and trust.',x:48,y:58},
	{id:'armory',name:'Armory',description:'Racks of polished blades line the shadowed wall. One sword has recently been removed.',x:76,y:42},
	{id:'office',name:'Captain\'s Office',description:'Maps, wax seals, and a single locked drawer hint at the mission ahead.',x:68,y:18},
	{id:'stable',name:'Stable',description:'Restless horses stamp in their stalls as if they already know a ride is coming.',x:25,y:25}
];
const scenes = [
	{id:'arrival',chapter:1,title:'Arrival in Paris',location:'gate',description:'The city opens beyond the headquarters gate in a blur of bells, carts, and whispered names. You have come with a letter, a sword, and a future you intend to claim.',characters:['D\'Artagnan'],dialogue:[['D\'Artagnan','Paris is louder than every story I heard about it. Somewhere in this courtyard is the beginning I came for.']]},
	{id:'streets',chapter:1,title:'Exploring the Streets',location:'gate',description:'You study the headquarters entrance and the current of people beyond it. A flash of blue cloaks passes ahead, marked by the unmistakable confidence of musketeers.',characters:['D\'Artagnan','Messenger'],dialogue:[['Messenger','If you are looking for the musketeers, look for trouble. It usually finds them first.']]},
	{id:'encounter',chapter:1,title:'First Encounter',location:'training',description:'The training yard becomes a stage. Three swordsmen arrive from different doors, each carrying a grievance and an impeccable sense of timing.',characters:['Athos','Porthos','Aramis'],dialogue:[['Athos','A stranger with a drawn sword is either very brave or very lost.'],['D\'Artagnan','Then let me be brave enough to introduce myself.']]},
	{id:'challenge',chapter:2,title:'The Challenge',location:'training',description:'What begins as a quarrel gathers an audience around the practice ring. Before steel can settle the matter, a greater authority interrupts the scene.',characters:['Athos','Porthos','Aramis'],dialogue:[['Porthos','You have spirit. Keep it, and perhaps keep your head too.']]},
	{id:'meeting',chapter:2,title:'Meeting the Musketeers',location:'training',description:'The yard falls quiet as the first heat of rivalry cools into curiosity. The famous motto is more than decoration: it is an invitation to stand together.',characters:['Athos','Porthos','Aramis','D\'Artagnan'],dialogue:[['Aramis','One for all, and all for one. The words matter only when tested.']]},
	{id:'tavern',chapter:2,title:'The Missing Message',location:'armory',description:'News travels through the armory faster than a blade leaves its sheath. A royal courier has vanished, and with him a message that could unsettle the court.',characters:['D\'Artagnan','Athos'],dialogue:[['Athos','The safest road is rarely the road worth taking.']]},
	{id:'adventure',chapter:3,title:'A New Adventure',location:'office',description:'The captain\'s office waits behind a heavy door. Your small fellowship has become a moving piece in a much larger game.',characters:['D\'Artagnan','Aramis'],dialogue:[['Aramis','Walk carefully. In a headquarters, even silence can be overheard.']]},
	{id:'conflict',chapter:3,title:'The Conflict',location:'office',description:'The message is recovered, but the danger is no longer hidden. With trust between you, the next chapter can begin beyond these walls.',characters:['D\'Artagnan','Athos','Porthos','Aramis'],dialogue:[['D\'Artagnan','Then we face what comes together.'],['Athos','That is how an adventure becomes a friendship.']]}
];
const AppContext=createContext(null);
function AppProvider({children}) { const [selectedCharacter,setSelectedCharacter]=useState(()=>localStorage.getItem('selectedCharacter')||''); const [progress,setProgress]=useState(()=>{try{return JSON.parse(localStorage.getItem('storyProgress'))||{current:0,visited:[0]}}catch{return {current:0,visited:[0]}}}); const selectCharacter=id=>{setSelectedCharacter(id);localStorage.setItem('selectedCharacter',id)}; const saveProgress=value=>{setProgress(value);localStorage.setItem('storyProgress',JSON.stringify(value))}; return <AppContext.Provider value={{selectedCharacter,selectCharacter,progress,saveProgress}}>{children}</AppContext.Provider> }
function useRoute(){const [route,setRoute]=useState(location.pathname); useEffect(()=>{const handler=()=>setRoute(location.pathname); addEventListener('popstate',handler); return()=>removeEventListener('popstate',handler)},[]); return route}
function go(path){history.pushState({},'',path);dispatchEvent(new PopStateEvent('popstate'))}
function Layout({children}){return <div className="app"><div className="shell"><header className="topbar"><a className="brand" href="/" onClick={e=>{e.preventDefault();go('/')}}>Chapter <span>&</span> Compass</a><span className="eyebrow">Interactive literature</span></header>{children}</div></div>}
function Landing(){return <main className="landing"><div className="landing-inner"><div className="eyebrow">A story you can enter</div><h1>Step into the <em>story.</em></h1><p>Become the character. Follow the clues. Find your place among the legendary musketeers.</p><button className="btn" onClick={()=>go('/library')}>Enter the Library</button></div></main>}
function Library(){return <main className="page"><div className="page-heading"><div className="eyebrow">The collection / 01</div><h1>Choose a world.</h1><p>Read with your feet on the ground. Each title is a small map of choices, encounters, and turning points.</p></div><div className="book-grid">{books.map(book=><React.Fragment key={book.id}><div className="book-cover"><div className="cover-mark"><strong>THE<br/>THREE<br/>MUSKETEERS</strong><small>ALEXANDRE DUMAS</small></div></div><div className="book-copy"><div className="eyebrow">Featured journey</div><h2>{book.title}</h2><div className="author">{book.author}</div><p>{book.description}</p><button className="btn" onClick={()=>go('/book/'+book.id)}>Enter Story</button></div></React.Fragment>)}</div></main>}
function BookIntro(){return <main className="page"><div className="page-heading"><div className="eyebrow">A playable introduction</div><h1>The Three Musketeers</h1><p className="author">Alexandre Dumas</p><p>Paris is waiting in 1625: a young arrival with more courage than coin, a royal court full of hidden currents, and three extraordinary swordsmen whose friendship will redraw the map of your life.</p><button className="btn" onClick={()=>go('/book/three-musketeers/characters')}>Choose Your Character</button></div></main>}
function CharacterSelection(){const {selectedCharacter,selectCharacter}=useContext(AppContext); const chosen=characters.find(c=>c.id===selectedCharacter); return <main className="page"><div className="page-heading"><div className="eyebrow">The first decision</div><h1>Who enters the story?</h1><p>Every perspective notices something different. Choose a character to carry through the journey.</p></div><div className="character-grid">{characters.map(c=><button className={'character-card '+(c.id===selectedCharacter?'selected':'')} key={c.id} onClick={()=>selectCharacter(c.id)}><div className="character-initial">{c.name[0]}</div><h3>{c.name}</h3><p>{c.description}</p></button>)}</div><div className="selection-actions"><button className="btn" disabled={!selectedCharacter} onClick={()=>go('/story/three-musketeers')}>Enter the Story</button><span>{chosen?`Playing as ${chosen.name}`:'Select a card to continue'}</span></div></main>}
function Timeline({progress,onJump}){return <div className="timeline">{scenes.map((scene,index)=>{const visited=progress.visited.includes(index);return <button key={scene.id} className={(visited?'visited ':'')+(progress.current===index?'current':'')} disabled={!visited} onClick={()=>onJump(index)}><span className="dot">{progress.current===index?'●':visited?'✓':'○'}</span>{scene.title}</button>})}</div>}
function StoryPage(){const {selectedCharacter,progress}=useContext(AppContext); const character=characters.find(c=>c.id===selectedCharacter); if(!character){go('/book/three-musketeers/characters');return null} const vrUrl='/chapter-world?character='+encodeURIComponent(character.name)+'&scene='+progress.current; const toggleFullscreen=()=>{const frame=document.querySelector('.vr-frame'); if(document.fullscreenElement){document.exitFullscreen()}else if(frame?.requestFullscreen){frame.requestFullscreen()}}; return <main className="vr-launch"><div className="vr-launch-head"><div><div className="eyebrow">Chapter One · The Three Presents</div><h1>Gascony, 1625</h1><p>Playing as <strong>{character.name}</strong>. Enter the world to explore D'Artagnan's first journey.</p></div><div className="vr-actions"><button className="btn ghost" onClick={toggleFullscreen}>Fullscreen</button><button className="btn ghost" onClick={()=>go('/book/three-musketeers/characters')}>Change Character</button></div></div><iframe className="vr-frame" title="The Three Musketeers VR chapter" src={vrUrl} allow="xr-spatial-tracking; fullscreen" /></main>}
function NotFound(){return <main className="not-found"><div className="eyebrow">Page missing</div><h1>404</h1><p>The page you are looking for is not in this chapter.</p><button className="btn" onClick={()=>go('/')}>Return Home</button></main>}
function Router(){const route=useRoute(); let page=route==='/'?<Landing/>:route==='/library'?<Library/>:route==='/book/three-musketeers'?<BookIntro/>:route==='/book/three-musketeers/characters'?<CharacterSelection/>:route==='/story/three-musketeers'?<StoryPage/>:<NotFound/>;return <Layout>{page}</Layout>}
ReactDOM.createRoot(document.getElementById('root')).render(<AppProvider><Router/></AppProvider>);
</script>
</body></html>
